<script>
  // Sicherheitsnetz gegen die "weiße Seite": Lädt eine Skriptdatei nicht (Netz, Cache, Deploy-Wechsel) oder startet die App nicht,
  // lädt die Seite einmal selbst neu. Klappt es dann wieder nicht, erscheint eine Meldung mit den betroffenen Dateien statt Weiß.
  (function () {
    var fehlende = [];
    window.addEventListener("error", function (e) {
      var t = e.target;
      if (t && t.tagName === "SCRIPT" && t.src) fehlende.push(t.src.replace(location.origin, ""));
    }, true);
    window.addEventListener("load", function () {
      setTimeout(function () {
        var root = document.getElementById("root");
        if (!root) return;
        var schon = false;
        try { schon = sessionStorage.getItem("nsz_neuladen") === "1"; } catch (e) {}
        if (root.dataset.rendered) {
          try { sessionStorage.removeItem("nsz_neuladen"); } catch (e) {}
          return;
        }
        if (!schon) {
          try { sessionStorage.setItem("nsz_neuladen", "1"); } catch (e) {}
          location.reload();
          return;
        }
        root.innerHTML =
          '<div style="padding:24px 20px;max-width:480px;margin:0 auto;font-family:system-ui,sans-serif;line-height:1.5">' +
          '<h1 style="font-size:20px;margin:0 0 8px">Die Seite konnte nicht geladen werden</h1>' +
          '<p style="font-size:14px;margin:0 0 16px">Bitte prüfe die Verbindung und versuche es nochmal.</p>' +
          '<button onclick="location.reload()" style="font:inherit;font-size:14px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid #888;background:#fff;color:#000;cursor:pointer">Neu laden</button>' +
          '<p style="font-size:12px;opacity:.7;margin:16px 0 0;word-break:break-all">Technische Angabe: ' + (fehlende.join(", ") || "keine Ladefehler gemeldet") + "</p></div>";
      }, 1500);
    });
  })();
</script>

<script>
  try {
    var _t = localStorage.getItem("nsz_darstellung");
    if (_t === "hell" || _t === "dunkel") document.documentElement.setAttribute("data-theme", _t === "dunkel" ? "dark" : "light");
  } catch (e) {}
  // Seitentitel passend zur Adresse (Administration bzw. Team aus dem Hostnamen)
  try {
    var _m = location.hostname.match(/^([a-z0-9-]+)\.nachspielzeit\.app$/i);
    if (_m && _m[1].toLowerCase() === "admin") document.title = "Nachspielzeit — Administration";
    else if (_m && _m[1].toLowerCase() !== "www") document.title = "Nachspielzeit — SV Heimstetten " + _m[1].toUpperCase();
  } catch (e) {}
  // Administration als eigene App erkennbar: eigener Name, eigenes Symbol, dunkle Statusleiste (gleiche Regel wie IS_ADMIN_HOST in der App)
  try {
    if (/^admin\./i.test(location.hostname) || /[?&]admin=1\b/.test(location.search)) {
      document.querySelector('link[rel="manifest"]').setAttribute("href", "manifest-admin.json");
      document.querySelector('link[rel="apple-touch-icon"]').setAttribute("href", "apple-touch-icon-admin.png");
      document.querySelector('meta[name="theme-color"]').setAttribute("content", "#262A34");
      document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute("content", "Admin");
    }
  } catch (e) {}
</script>
