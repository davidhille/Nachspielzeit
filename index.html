const REST = SUPABASE_URL + "/rest/v1/";

let ACCESS_CODE = localStorage.getItem("nsz_access_code") || "";

const baseHeaders = (extra = {}) => ({
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`,
  "Content-Type": "application/json",
  ...extra,
});
const dbHeaders = (extra = {}) => baseHeaders({ "x-access-code": ACCESS_CODE, ...extra });

async function verifyAccessCode(code) {
  const res = await fetch(REST + "rpc/check_access_code", {
    method: "POST",
    headers: baseHeaders(),
    body: JSON.stringify({ code }),
  });
  if (!res.ok) return false;
  return (await res.json()) === true;
}

async function dbSelect(table) {
  const res = await fetch(REST + table + "?select=*", { headers: dbHeaders() });
  if (!res.ok) throw new Error(`Laden von "${table}" fehlgeschlagen: ${await res.text()}`);
  return res.json();
}
async function dbInsert(table, rowOrRows) {
  const res = await fetch(REST + table, {
    method: "POST",
    headers: dbHeaders({ Prefer: "return=representation" }),
    body: JSON.stringify(rowOrRows),
  });
  if (!res.ok) throw new Error(`Speichern in "${table}" fehlgeschlagen: ${await res.text()}`);
  return res.json();
}
async function dbUpsert(table, row, conflictCol) {
  const res = await fetch(`${REST}${table}?on_conflict=${conflictCol}`, {
    method: "POST",
    headers: dbHeaders({ Prefer: "resolution=merge-duplicates,return=representation" }),
    body: JSON.stringify(row),
  });
  if (!res.ok) throw new Error(`Speichern in "${table}" fehlgeschlagen: ${await res.text()}`);
  return res.json();
}
async function dbUpdate(table, id, patch, idCol = "id") {
  const res = await fetch(`${REST}${table}?${idCol}=eq.${id}`, {
    method: "PATCH",
    headers: dbHeaders({ Prefer: "return=representation" }),
    body: JSON.stringify(patch),
  });
  if (!res.ok) throw new Error(`Aktualisieren von "${table}" fehlgeschlagen: ${await res.text()}`);
  return res.json();
}
async function dbDelete(table, id, idCol = "id") {
  const res = await fetch(`${REST}${table}?${idCol}=eq.${id}`, { method: "DELETE", headers: dbHeaders() });
  if (!res.ok) throw new Error(`Löschen in "${table}" fehlgeschlagen: ${await res.text()}`);
}
async function dbDeleteWhere(table, qs) {
  const res = await fetch(`${REST}${table}?${qs}`, { method: "DELETE", headers: dbHeaders() });
  if (!res.ok) throw new Error(`Löschen in "${table}" fehlgeschlagen: ${await res.text()}`);
}

/* ---------- Konstanten ---------- */
const KARTEN = { keine: 0, gelb: -0.5, blau: -1.0, rot: -2.0 };
const TEILNAHME = { anwesend: 0.5, verspaetet: -0.25, unentschuldigt: -0.25, entschuldigt: 0 };
const TEILNAHME_LABEL = {
  anwesend: "Anwesend",
  verspaetet: "Verspätet",
  unentschuldigt: "Unentschuldigt gefehlt",
  entschuldigt: "Abgemeldet",
};
const WOCHENTAGE = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

const toLocalISODate = (d) => {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
};
const todayISO = () => toLocalISODate(new Date());
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const monthLabel = (key) => {
  const [y, m] = key.split("-");
  return new Date(Number(y), Number(m) - 1, 1).toLocaleDateString("de-DE", { month: "long", year: "numeric" });
};
const formatTerminLabel = (dateStr) => {
  const d = new Date(dateStr + "T00:00:00");
  return `${WOCHENTAGE[d.getDay()]}, ${d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" })}`;
};

// Saison läuft von September bis einschließlich Juli des Folgejahres.
function seasonKeyOf(mkey) {
  const [y, m] = mkey.split("-").map(Number);
  if (m >= 9) return `${y}-${y + 1}`;
  if (m <= 7) return `${y - 1}-${y}`;
  return null;
}

function trainingPunkte(entry) {
  return (Number(entry.vorkommnis) || 0) + KARTEN[entry.karte] + TEILNAHME[entry.teilnahme];
}

function basisNachMonat(playerId, basis, entwicklungen, monatKeyInklusiv) {
  const grund = Number(basis[playerId]) || 0;
  const bonus = entwicklungen
    .filter((e) => e.playerId === playerId && e.month <= monatKeyInklusiv)
    .reduce((sum, e) => sum + Number(e.punkte || 0), 0);
  return grund + bonus;
}

function aktuelleBasis(playerId, basis, entwicklungen, biMonatKeyExklusiv) {
  const grund = Number(basis[playerId]) || 0;
  const bonus = entwicklungen
    .filter((e) => e.playerId === playerId && e.month < biMonatKeyExklusiv)
    .reduce((sum, e) => sum + Number(e.punkte || 0), 0);
  return grund + bonus;
}

/* ---------- Zugangscode-Gate ---------- */

function Gate({ onUnlock }) {
  const [code, setCode] = useState("");
  const [checking, setChecking] = useState(false);
  const [fehler, setFehler] = useState("");

  const pruefen = async () => {
    if (!code.trim()) return;
    setChecking(true);
    setFehler("");
    try {
      const ok = await verifyAccessCode(code.trim());
      if (ok) {
        localStorage.setItem("nsz_access_code", code.trim());
        onUnlock(code.trim());
      } else {
        setFehler("Zugangscode ist falsch.");
      }
    } catch (e) {
      setFehler("Verbindung fehlgeschlagen. Internet prüfen und erneut versuchen.");
    } finally {
      setChecking(false);
    }
  };

  return (
    <div style={styles.loadingScreen}>
      <img src={LOGO_DATA_URI} alt="SV Heimstetten" style={{ width: 64, marginBottom: 4 }} />
      <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 19, fontWeight: 700, color: "#1C2B22" }}>
        Nachspielzeit
      </div>
      <input
        style={{ ...styles.input, flex: "none", width: 220, maxWidth: 240, textAlign: "center" }}
        placeholder="Zugangscode"
        type="password"
        value={code}
        onChange={(e) => setCode(e.target.value)}
        onKeyDown={(e) => {
          if (e.key === "Enter") pruefen();
        }}
        autoFocus
      />
      {fehler && <div style={{ color: "#9B2226", fontSize: 13 }}>{fehler}</div>}
      <button
        style={{ ...styles.primaryBtn, flex: "none", width: 220, maxWidth: 240 }}
        onClick={pruefen}
        disabled={checking || !code.trim()}
      >
        {checking ? "Prüfe …" : "Anmelden"}
      </button>
    </div>
  );
}

function Root() {
  const [unlocked, setUnlocked] = useState(!!ACCESS_CODE);
  if (!unlocked) {
    return (
      <Gate
        onUnlock={(code) => {
          ACCESS_CODE = code;
          setUnlocked(true);
        }}
      />
    );
  }
  return <App />;
}

      const basisMap = {};
      basisRaw.forEach((r) => (basisMap[r.player_id] = Number(r.wert)));
      setBasis(basisMap);
      setTermine(termineRaw);
      setTrainings(
        trainingsRaw.map((t) => ({
          id: t.id,
          date: t.date,
          playerId: t.player_id,
          vorkommnis: Number(t.vorkommnis),
          karte: t.karte,
          teilnahme: t.teilnahme,
          kommentar: t.kommentar || "",
        }))
      );
      setEntwicklungen(
        entwRaw.map((e) => ({ id: e.id, month: e.month, playerId: e.player_id, punkte: Number(e.punkte) }))
      );
      setGegner(gegnerRaw);
      const spieltageFull = spieltageRaw.map((s) => ({
        id: s.id,
        date: s.date,
        spiele: spieleRaw
          .filter((sp) => sp.spieltag_id === s.id)
          .map((sp) => ({
            id: sp.id,
            opponentId: sp.opponent_id,
            ourGoals: sp.our_goals,
            theirGoals: sp.their_goals,
            scorers: torRaw
              .filter((t) => t.spiel_id === sp.id)
              .map((t) => ({ id: t.id, playerId: t.player_id, tore: t.tore })),
          })),
      }));
      setSpieltage(spieltageFull);
      setError("");
    } catch (e) {
      console.error(e);
      setError(e.message || "Unbekannter Fehler beim Laden der Daten.");
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    refreshAll();
  }, [refreshAll]);

  const activePlayers = useMemo(() => players.filter((p) => p.active !== false), [players]);

  const wrapAction = async (fn, successMsg) => {
    try {
      await fn();
      await refreshAll();
      if (successMsg) showToast(successMsg);
    } catch (e) {
      console.error(e);
      window.alert(e.message || "Etwas ist schiefgelaufen.");
    }
  };

  if (loading) {
    return (
      <div style={styles.loadingScreen}>
        <div style={styles.loadingBall} />
        <span>Lade Daten aus der Datenbank …</span>
      </div>
    );
  }

  if (error) {
    return (
      <div style={styles.loadingScreen}>
        <span style={{ color: "#9B2226", fontWeight: 600 }}>Verbindung fehlgeschlagen</span>
        <span style={{ fontSize: 13, color: "#8A6F6F", textAlign: "center", padding: "0 24px" }}>{error}</span>
        <button style={styles.primaryBtn} onClick={refreshAll}>
          Erneut versuchen
        </button>
      </div>
    );
  }

  return (
    <div style={styles.app}>
      <Header tab={tab} setTab={setTab} />
      <main style={styles.main}>
        {tab === "dashboard" && (
          <Dashboard
            players={players}
            basis={basis}
            trainings={trainings}
            entwicklungen={entwicklungen}
            spieltage={spieltage}
            gegner={gegner}
          />
        )}
        {tab === "training" && (
          <TrainingBewertung
            players={activePlayers}
            trainings={trainings}
            termine={termine}
            onSave={(entries, date) =>
              wrapAction(async () => {
                await dbDeleteWhere("trainings", `date=eq.${date}`);
                await dbInsert(
                  "trainings",
                  entries.map((e) => ({
                    id: e.id,
                    date: e.date,
                    player_id: e.playerId,
                    vorkommnis: e.vorkommnis,
                    karte: e.karte,
                    teilnahme: e.teilnahme,
                    kommentar: e.kommentar || "",
                  }))
                );
              }, "Trainingsbewertung gespeichert")
            }
          />
        )}
        {tab === "entwicklung" && (
          <MonatsEntwicklung
            players={activePlayers}
            entwicklungen={entwicklungen}
            onSave={(entries, month) =>
              wrapAction(async () => {
                await dbDeleteWhere("entwicklungen", `month=eq.${month}`);
                await dbInsert(
                  "entwicklungen",
                  entries.map((e) => ({ id: e.id, month: e.month, player_id: e.playerId, punkte: e.punkte }))
                );
              }, "Monatsentwicklung gespeichert")
            }
          />
        )}
        {tab === "spieltage" && (
          <Spieltage
            players={players}
            gegner={gegner}
            spieltage={spieltage}
            onAddSpieltag={(date) => wrapAction(() => dbInsert("spieltage", { id: uid(), date }))}
            onRemoveSpieltag={(id) => wrapAction(() => dbDelete("spieltage", id))}
            onAddSpiel={(spieltagId, spiel) =>
              wrapAction(async () => {
                await dbInsert("spiele", {
                  id: spiel.id,
                  spieltag_id: spieltagId,
                  opponent_id: spiel.opponentId,
                  our_goals: spiel.ourGoals,
                  their_goals: spiel.theirGoals,
                });
                if (spiel.scorers.length > 0) {
                  await dbInsert(
                    "torschuetzen",
                    spiel.scorers.map((s) => ({ id: s.id, spiel_id: spiel.id, player_id: s.playerId, tore: s.tore }))
                  );
                }
              }, "Spiel gespeichert")
            }
            onUpdateSpiel={(spieltagId, spiel) =>
              wrapAction(async () => {
                await dbUpdate("spiele", spiel.id, {
                  opponent_id: spiel.opponentId,
                  our_goals: spiel.ourGoals,
                  their_goals: spiel.theirGoals,
                });
                await dbDeleteWhere("torschuetzen", `spiel_id=eq.${spiel.id}`);
                if (spiel.scorers.length > 0) {
                  await dbInsert(
                    "torschuetzen",
                    spiel.scorers.map((s) => ({ id: s.id, spiel_id: spiel.id, player_id: s.playerId, tore: s.tore }))
                  );
                }
              }, "Spiel aktualisiert")
            }
            onRemoveSpiel={(spieltagId, spielId) => wrapAction(() => dbDelete("spiele", spielId))}
          />
        )}
        {tab === "verwaltung" && (
          <Verwaltung
            players={players}
            basis={basis}
            termine={termine}
            gegner={gegner}
            onAdd={(name) => wrapAction(() => dbInsert("players", { id: uid(), name, active: true }))}
            onToggleActive={(id) => {
              const p = players.find((x) => x.id === id);
              return wrapAction(() => dbUpdate("players", id, { active: !(p?.active !== false) }));
            }}
            onRemove={(id) => wrapAction(() => dbDelete("players", id))}
            onBasisChange={(playerId, wert) =>
              wrapAction(() => dbUpsert("basisqualitaet", { player_id: playerId, wert }, "player_id"))
            }
            onGenerateTermine={(neueTermine) =>
              wrapAction(async () => {
                const bestehendeDaten = new Set(termine.map((t) => t.date));
                const zusaetzliche = neueTermine.filter((t) => !bestehendeDaten.has(t.date));
                if (zusaetzliche.length > 0) await dbInsert("trainingstermine", zusaetzliche);
              }, "Termine angelegt")
            }
            onToggleAbsage={(id) => {
              const t = termine.find((x) => x.id === id);
              const neuerStatus = t?.status === "abgesagt" ? "geplant" : "abgesagt";
              return wrapAction(() => dbUpdate("trainingstermine", id, { status: neuerStatus }));
            }}
            onRemoveTermin={(id) => wrapAction(() => dbDelete("trainingstermine", id))}
            onAddGegner={(name) => wrapAction(() => dbInsert("gegner", { id: uid(), name }))}
            onRemoveGegner={(id) => wrapAction(() => dbDelete("gegner", id))}
          />
        )}
      </main>
      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}

function SaisonBilanz({ spieltage, players, month }) {
  const saison = seasonKeyOf(month);

  const spieleDerSaison = useMemo(
    () => spieltage.filter((s) => seasonKeyOf(s.date.slice(0, 7)) === saison).flatMap((s) => s.spiele),
    [spieltage, saison]
  );

  const bilanz = spieleDerSaison.reduce(
    (acc, sp) => {
      acc.toreFuer += sp.ourGoals;
      acc.toreGegen += sp.theirGoals;
      if (sp.ourGoals > sp.theirGoals) acc.siege += 1;
      else if (sp.ourGoals < sp.theirGoals) acc.niederlagen += 1;
      else acc.unentschieden += 1;
      sp.scorers.forEach((sc) => {
        acc.tore[sc.playerId] = (acc.tore[sc.playerId] || 0) + Number(sc.tore || 0);
      });
      return acc;
    },
    { siege: 0, unentschieden: 0, niederlagen: 0, toreFuer: 0, toreGegen: 0, tore: {} }
  );

  const spielerName = (id) => players.find((p) => p.id === id)?.name || "Unbekannt";
  const torschuetzen = Object.entries(bilanz.tore)
    .map(([playerId, tore]) => ({ playerId, tore }))
    .sort((a, b) => b.tore - a.tore);

  return (
    <div style={{ marginTop: 28 }}>
      <h3 style={styles.h3}>Saisonbilanz {saison ? saison.replace("-", "/") : ""}</h3>

      {spieleDerSaison.length === 0 && (
        <EmptyState text="Noch keine Spiele in dieser Saison erfasst. Lege sie unter „Spieltage“ an." />
      )}

      {spieleDerSaison.length > 0 && (
        <>
          <div style={styles.statsRow}>
            <div style={styles.statBox}>
              <div style={styles.statValue}>{spieleDerSaison.length}</div>
              <div style={styles.statLabel}>Spiele</div>
            </div>
            <div style={styles.statBox}>
              <div style={styles.statValue}>{bilanz.siege}</div>
              <div style={styles.statLabel}>Siege</div>
            </div>
            <div style={styles.statBox}>
              <div style={styles.statValue}>{bilanz.unentschieden}</div>
              <div style={styles.statLabel}>Unentschieden</div>
            </div>
            <div style={styles.statBox}>
              <div style={styles.statValue}>{bilanz.niederlagen}</div>
              <div style={styles.statLabel}>Niederlagen</div>
            </div>
            <div style={styles.statBox}>
              <div style={styles.statValue}>
                {bilanz.toreFuer}:{bilanz.toreGegen}
              </div>
              <div style={styles.statLabel}>Tore</div>
            </div>
          </div>

          {torschuetzen.length > 0 && (
            <div style={{ marginTop: 14 }}>
              <div style={styles.subheading}>Torschützenliste</div>
              <div style={styles.tableWrap}>
                <table style={styles.table}>
                  <tbody>
                    {torschuetzen.map((t, i) => (
                      <tr key={t.playerId}>
                        <td style={styles.tdName}>
                          <span style={styles.rank}>{i + 1}</span>
                          {spielerName(t.playerId)}
                        </td>
                        <td style={{ ...styles.td, textAlign: "right", fontWeight: 700 }}>{t.tore}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function EntwicklungsVerlauf({ players, basis, entwicklungen, months, month }) {
  const saison = seasonKeyOf(month);
  const saisonMonate = useMemo(() => months.filter((m) => seasonKeyOf(m) === saison).sort(), [months, saison]);

  if (players.length === 0) return null;

  return (
    <div style={{ marginTop: 28 }}>
      <h3 style={styles.h3}>Entwicklungsverlauf (Basis-Qualität)</h3>
      {saisonMonate.length < 2 ? (
        <EmptyState text="Noch nicht genug Monate mit Daten für einen Verlauf." />
      ) : (
        <div style={styles.sparkGrid}>
          {players.map((p) => {
            const werte = saisonMonate.map((m) => basisNachMonat(p.id, basis, entwicklungen, m));
            const letzterWert = werte[werte.length - 1];
            return (
              <div key={p.id} style={styles.sparkCard}>
                <div style={styles.sparkHead}>
                  <span style={styles.cardName}>{p.name}</span>
                  <span style={styles.sparkValue}>{letzterWert.toFixed(1)}</span>
                </div>
                <Sparkline values={werte} />
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Sparkline({ values, width = 220, height = 46 }) {
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const step = values.length > 1 ? width / (values.length - 1) : 0;
  const points = values
    .map((v, i) => {
      const x = i * step;
      const y = height - ((v - min) / range) * (height - 6) - 3;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    })
    .join(" ");
  const lastX = (values.length - 1) * step;
  const lastY = height - ((values[values.length - 1] - min) / range) * (height - 6) - 3;
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none">
      <polyline points={points} fill="none" stroke="#AE1E1D" strokeWidth="2" />
      <circle cx={lastX} cy={lastY} r="3" fill="#AE1E1D" />
    </svg>
  );
}

/* ---------- Training bewerten ---------- */

function TrainingBewertung({ players, trainings, termine, onSave }) {
  const geplanteTermine = useMemo(
    () =>
      termine
        .filter((t) => t.status !== "abgesagt")
        .slice()
        .sort((a, b) => b.date.localeCompare(a.date)),
    [termine]
  );
  const today = todayISO();
  const defaultDate = geplanteTermine.find((t) => t.date <= today)?.date || geplanteTermine[0]?.date || "";
  const [date, setDate] = useState(defaultDate);
  const [rows, setRows] = useState({});

  useEffect(() => {
    if (!date && geplanteTermine[0]) setDate(geplanteTermine[0].date);
  }, [geplanteTermine]); // eslint-disable-line

  useEffect(() => {
    const init = {};
    players.forEach((p) => {
      const existing = trainings.find((t) => t.date === date && t.playerId === p.id);
      init[p.id] = existing
        ? { vorkommnis: existing.vorkommnis, karte: existing.karte, teilnahme: existing.teilnahme, kommentar: existing.kommentar || "" }
        : { vorkommnis: 0, karte: "keine", teilnahme: "anwesend", kommentar: "" };
    });
    setRows(init);
  }, [date, players, trainings]);

  const getRow = (id) => rows[id] || { vorkommnis: 0, karte: "keine", teilnahme: "anwesend", kommentar: "" };
  const setRow = (id, patch) => setRows((r) => ({ ...r, [id]: { ...getRow(id), ...patch } }));

  const save = () => {
    if (players.length === 0 || !date) return;
    const entries = players.map((p) => ({ id: uid(), date, playerId: p.id, ...getRow(p.id) }));
    onSave(entries, date);
  };

  return (
    <section>
      <div style={styles.rowBetween}>
        <h2 style={styles.h2}>Training bewerten</h2>
        {geplanteTermine.length > 0 ? (
          <select style={styles.select} value={date} onChange={(e) => setDate(e.target.value)}>
            {geplanteTermine.map((t) => (
              <option key={t.id} value={t.date}>
                {formatTerminLabel(t.date)}
              </option>
            ))}
          </select>
        ) : (
          <span style={styles.hint}>Keine Termine angelegt</span>
        )}
      </div>

      {geplanteTermine.length === 0 && (
        <EmptyState text="Noch keine Trainingstermine angelegt. Lege sie unter „Verwaltung“ an." />
      )}
      {geplanteTermine.length > 0 && players.length === 0 && (
        <EmptyState text="Noch keine aktiven Spieler vorhanden." />
      )}

      <div style={styles.cardList}>
        {players.map((p) => {
          const row = getRow(p.id);
          const punkte = trainingPunkte(row);
          return (
            <div key={p.id} style={styles.card}>
              <div style={styles.cardHead}>
                <span style={styles.cardName}>{p.name}</span>
                <span
                  style={{
                    ...styles.pill,
                    background: punkte >= 0 ? "#DCEFE3" : "#FBE0E0",
                    color: punkte >= 0 ? "#1B4332" : "#9B2226",
                  }}
                >
                  {punkte >= 0 ? "+" : ""}
                  {punkte.toFixed(2)} Pkt.
                </span>
              </div>

              <div style={styles.fieldRow}>
                <label style={styles.label}>Teilnahme</label>
                <select style={styles.select} value={row.teilnahme} onChange={(e) => setRow(p.id, { teilnahme: e.target.value })}>
                  {Object.keys(TEILNAHME).map((k) => (
                    <option key={k} value={k}>
                      {TEILNAHME_LABEL[k]} ({TEILNAHME[k] > 0 ? "+" : ""}
                      {TEILNAHME[k]})
                    </option>
                  ))}
                </select>
              </div>

              <div style={styles.fieldRow}>
                <label style={styles.label}>Besonderes Vorkommnis</label>
                <input
                  type="range"
                  min={-1}
                  max={1}
                  step={0.25}
                  value={row.vorkommnis}
                  onChange={(e) => setRow(p.id, { vorkommnis: Number(e.target.value) })}
                  style={styles.range}
                />
                <span style={styles.rangeValue}>
                  {row.vorkommnis > 0 ? "+" : ""}
                  {Number(row.vorkommnis).toFixed(2)}
                </span>
              </div>

              <div style={styles.fieldRow}>
                <label style={styles.label}>Karte</label>
                <div style={styles.chipGroup}>
                  {Object.keys(KARTEN).map((k) => (
                    <button
                      key={k}
                      onClick={() => setRow(p.id, { karte: k })}
                      style={{ ...styles.chip, ...(row.karte === k ? styles.chipActive : {}) }}
                    >
                      {k === "keine" ? "Keine" : k[0].toUpperCase() + k.slice(1)}
                    </button>
                  ))}
                </div>
              </div>

              <div style={{ marginTop: 8 }}>
                <label style={styles.label}>Kommentar (optional)</label>
                <textarea
                  style={styles.textarea}
                  placeholder="Etwas Besonderes zu diesem Spieler festhalten…"
                  value={row.kommentar || ""}
                  onChange={(e) => setRow(p.id, { kommentar: e.target.value })}
                  rows={2}
                />
              </div>
            </div>
          );
        })}
      </div>

      {players.length > 0 && date && (
        <button style={styles.primaryBtn} onClick={save}>
          Trainingsbewertung speichern
        </button>
      )}
    </section>
  );
}

/* ---------- Monatsentwicklung ---------- */

function MonatsEntwicklung({ players, entwicklungen, onSave }) {
  const [month, setMonth] = useState(monthKey(new Date()));
  const [values, setValues] = useState({});

  useEffect(() => {
    const init = {};
    players.forEach((p) => {
      const existing = entwicklungen.find((e) => e.playerId === p.id && e.month === month);
      init[p.id] = existing ? existing.punkte : 0;
    });
    setValues(init);
  }, [month, players, entwicklungen]);

  const save = () => {
    const entries = players.map((p) => ({ id: uid(), month, playerId: p.id, punkte: Number(values[p.id] || 0) }));
    onSave(entries, month);
  };

  return (
    <section>
      <div style={styles.rowBetween}>
        <h2 style={styles.h2}>Monatsentwicklung</h2>
        <input type="month" value={month} onChange={(e) => setMonth(e.target.value)} style={styles.select} />
      </div>
      <p style={styles.hint}>Extrapunkte (-1 bis +1) fließen ab dem Folgemonat in die Basis-Qualität ein.</p>

      {players.length === 0 && <EmptyState text="Noch keine aktiven Spieler vorhanden." />}

      <div style={styles.cardList}>
        {players.map((p) => (
          <div key={p.id} style={styles.card}>
            <div style={styles.cardHead}>
              <span style={styles.cardName}>{p.name}</span>
            </div>
            <div style={styles.fieldRow}>
              <input
                type="range"
                min={-1}
                max={1}
                step={0.25}
                value={values[p.id] ?? 0}
                onChange={(e) => setValues((v) => ({ ...v, [p.id]: Number(e.target.value) }))}
                style={styles.range}
              />
              <span style={styles.rangeValue}>
                {(values[p.id] ?? 0) > 0 ? "+" : ""}
                {Number(values[p.id] ?? 0).toFixed(2)}
              </span>
            </div>
          </div>
        ))}
      </div>

      {players.length > 0 && (
        <button style={styles.primaryBtn} onClick={save}>
          Monatsentwicklung speichern
        </button>
      )}
    </section>
  );
}

/* ---------- Spieltage ---------- */

function Spieltage({ players, gegner, spieltage, onAddSpieltag, onRemoveSpieltag, onAddSpiel, onUpdateSpiel, onRemoveSpiel }) {
  const [neuesDatum, setNeuesDatum] = useState(todayISO());
  const [openSpieltag, setOpenSpieltag] = useState(null);
  const sorted = [...spieltage].sort((a, b) => b.date.localeCompare(a.date));

  return (
    <section>
      <h2 style={styles.h2}>Spieltage</h2>

      <div style={{ ...styles.addRow, marginTop: 4 }}>
        <input type="date" style={styles.select} value={neuesDatum} onChange={(e) => setNeuesDatum(e.target.value)} />
        <button style={styles.secondaryBtn} onClick={() => onAddSpieltag(neuesDatum)}>
          Spieltag anlegen
        </button>
      </div>

      {sorted.length === 0 && <EmptyState text="Noch keine Spieltage angelegt." />}

      <div style={styles.cardList}>
        {sorted.map((s) => (
          <SpieltagCard
            key={s.id}
            spieltag={s}
            players={players}
            gegner={gegner}
            open={openSpieltag === s.id}
            onToggle={() => setOpenSpieltag(openSpieltag === s.id ? null : s.id)}
            onRemoveSpieltag={() => onRemoveSpieltag(s.id)}
            onAddSpiel={(spiel) => onAddSpiel(s.id, spiel)}
            onUpdateSpiel={(spiel) => onUpdateSpiel(s.id, spiel)}
            onRemoveSpiel={(spielId) => onRemoveSpiel(s.id, spielId)}
          />
        ))}
      </div>
    </section>
  );
}

function SpieltagCard({ spieltag, players, gegner, open, onToggle, onRemoveSpieltag, onAddSpiel, onUpdateSpiel, onRemoveSpiel }) {
  const [opponentId, setOpponentId] = useState(gegner[0]?.id || "");
  const [ourGoals, setOurGoals] = useState(0);
  const [theirGoals, setTheirGoals] = useState(0);
  const [tally, setTally] = useState({});
  const [editingId, setEditingId] = useState(null);

  useEffect(() => {
    if (!opponentId && gegner[0]) setOpponentId(gegner[0].id);
  }, [gegner]); // eslint-disable-line

  const inc = (playerId) => {
    setTally((t) => ({ ...t, [playerId]: (t[playerId] || 0) + 1 }));
    setOurGoals((g) => Number(g) + 1);
  };
  const dec = (playerId) => {
    setTally((t) => {
      const current = (t[playerId] || 0) - 1;
      const next = { ...t };
      if (current <= 0) delete next[playerId];
      else next[playerId] = current;
      return next;
    });
    setOurGoals((g) => Math.max(0, Number(g) - 1));
  };

  const resetForm = () => {
    setEditingId(null);
    setOpponentId(gegner[0]?.id || "");
    setOurGoals(0);
    setTheirGoals(0);
    setTally({});
  };

  const startEdit = (sp) => {
    setEditingId(sp.id);
    setOpponentId(sp.opponentId);
    setOurGoals(sp.ourGoals);
    setTheirGoals(sp.theirGoals);
    const t = {};
    sp.scorers.forEach((sc) => (t[sc.playerId] = sc.tore));
    setTally(t);
  };

  const saveSpiel = () => {
    if (!opponentId) return;
    const spiel = {
      id: editingId || uid(),
      opponentId,
      ourGoals: Number(ourGoals) || 0,
      theirGoals: Number(theirGoals) || 0,
      scorers: Object.entries(tally).map(([playerId, tore]) => ({ id: uid(), playerId, tore })),
    };
    if (editingId) onUpdateSpiel(spiel);
    else onAddSpiel(spiel);
    resetForm();
  };

  const gegnerName = (id) => gegner.find((g) => g.id === id)?.name || "Unbekannt";
  const spielerName = (id) => players.find((p) => p.id === id)?.name || "Unbekannt";

  return (
    <div style={styles.card}>
      <div style={styles.cardHead}>
        <span style={styles.cardName}>
          {new Date(spieltag.date + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" })}
          <span style={styles.mutedTag}>
            {" "}
            · {spieltag.spiele.length} {spieltag.spiele.length === 1 ? "Spiel" : "Spiele"}
          </span>
        </span>
        <div style={{ display: "flex", gap: 8 }}>
          <button style={styles.linkBtn} onClick={onToggle}>
            {open ? "Schließen" : "Öffnen"}
          </button>
          <button style={{ ...styles.linkBtn, color: "#9B2226" }} onClick={onRemoveSpieltag}>
            Entfernen
          </button>
        </div>
      </div>

      {open && (
        <>
          {spieltag.spiele.length > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
              {spieltag.spiele.map((sp) => (
                <div key={sp.id} style={styles.spielRow}>
                  <div>
                    <strong>{gegnerName(sp.opponentId)}</strong> — {sp.ourGoals}:{sp.theirGoals}
                    {sp.scorers.length > 0 && (
                      <div style={styles.hint}>Tore: {sp.scorers.map((sc) => `${spielerName(sc.playerId)} (${sc.tore})`).join(", ")}</div>
                    )}
                  </div>
                  <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                    <button style={styles.linkBtn} onClick={() => startEdit(sp)}>
                      Bearbeiten
                    </button>
                    <button style={{ ...styles.linkBtn, color: "#9B2226" }} onClick={() => onRemoveSpiel(sp.id)}>
                      Entfernen
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          <div style={styles.basisGrid}>
            {editingId && (
              <div style={styles.editBanner}>
                Spiel wird bearbeitet.{" "}
                <button style={styles.linkBtn} onClick={resetForm}>
                  Abbrechen
                </button>
              </div>
            )}
            <div>
              <label style={styles.label}>Gegner</label>
              <div style={{ ...styles.chipGroup, marginTop: 6 }}>
                {gegner.length === 0 && <span style={styles.hint}>Noch kein Gegner angelegt.</span>}
                {gegner.map((g) => (
                  <button
                    key={g.id}
                    onClick={() => setOpponentId(g.id)}
                    style={{ ...styles.chip, ...(opponentId === g.id ? styles.chipActive : {}) }}
                  >
                    {g.name}
                  </button>
                ))}
              </div>
            </div>

            <div style={styles.fieldRow}>
              <label style={styles.label}>Ergebnis (Wir : Gegner)</label>
              <input
                type="number"
                min={0}
                style={{ ...styles.input, flex: "none", width: 60 }}
                value={ourGoals}
                onChange={(e) => setOurGoals(e.target.value)}
              />
              <span>:</span>
              <input
                type="number"
                min={0}
                style={{ ...styles.input, flex: "none", width: 60 }}
                value={theirGoals}
                onChange={(e) => setTheirGoals(e.target.value)}
              />
            </div>

            <div style={{ marginTop: 4 }}>
              <label style={styles.label}>Torschützen — antippen zum Erfassen</label>
              <div style={styles.scorerGrid}>
                {players.map((p) => {
                  const count = tally[p.id] || 0;
                  return (
                    <div key={p.id} style={{ ...styles.scorerTile, ...(count > 0 ? styles.scorerTileActive : {}) }}>
                      <button style={styles.scorerName} onClick={() => inc(p.id)}>
                        {p.name}
                      </button>
                      <div style={styles.scorerStepper}>
                        <button style={styles.stepBtn} onClick={() => dec(p.id)} disabled={count === 0}>
                          −
                        </button>
                        <span style={styles.stepCount}>{count}</span>
                        <button style={styles.stepBtn} onClick={() => inc(p.id)}>
                          +
                        </button>
                      </div>
                    </div>
                  );
                })}
                {players.length === 0 && <span style={styles.hint}>Noch keine Spieler angelegt.</span>}
              </div>
            </div>

            <button style={{ ...styles.primaryBtn, marginTop: 10 }} onClick={saveSpiel} disabled={!opponentId}>
              {editingId ? "Änderungen speichern" : "Spiel speichern"}
            </button>
          </div>
        </>
      )}
    </div>
  );
}

                      type="range"

function TrainingsplanBereich({ termine, onGenerateTermine, onToggleAbsage, onRemoveTermin }) {
  const [wochentage, setWochentage] = useState([2, 4]);
  const [wochen, setWochen] = useState(8);

  const toggleWochentag = (idx) => {
    setWochentage((w) => (w.includes(idx) ? w.filter((x) => x !== idx) : [...w, idx].sort()));
  };

  const generieren = () => {
    if (wochentage.length === 0) return;
    const neue = [];
    const start = new Date();
    start.setHours(0, 0, 0, 0);
    for (let i = 0; i < wochen * 7; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      if (wochentage.includes(d.getDay())) {
        neue.push({ id: uid(), date: toLocalISODate(d), status: "geplant" });
      }
    }
    onGenerateTermine(neue);
  };

  const sortiert = [...termine].sort((a, b) => a.date.localeCompare(b.date));
  const heute = todayISO();
  const kommende = sortiert.filter((t) => t.date >= heute);
  const vergangene = sortiert.filter((t) => t.date < heute).reverse();

  return (
    <div style={{ marginTop: 24 }}>
      <h3 style={styles.h3}>Trainingsplan</h3>

      <div style={styles.card}>
        <div style={styles.cardHead}>
          <span style={styles.cardName}>Termine generieren</span>
        </div>
        <div style={styles.fieldRow}>
          <label style={styles.label}>Wochentage</label>
          <div style={styles.chipGroup}>
            {[1, 2, 3, 4, 5].map((idx) => (
              <button
                key={idx}
                onClick={() => toggleWochentag(idx)}
                style={{ ...styles.chip, ...(wochentage.includes(idx) ? styles.chipActive : {}) }}
              >
                {WOCHENTAGE[idx]}
              </button>
            ))}
          </div>
        </div>
        <div style={styles.fieldRow}>
          <label style={styles.label}>Wochen im Voraus</label>
          <input
            type="number"
            min={1}
            max={52}
            style={{ ...styles.input, flex: "none", width: 70 }}
            value={wochen}
            onChange={(e) => setWochen(Number(e.target.value) || 1)}
          />
        </div>
        <button style={{ ...styles.secondaryBtn, marginTop: 10 }} onClick={generieren}>
          Termine generieren
        </button>
      </div>

      {sortiert.length === 0 && (
        <div style={{ marginTop: 12 }}>
          <EmptyState text="Noch keine Trainingstermine angelegt." />
        </div>
      )}

      {kommende.length > 0 && (
        <>
          <div style={styles.subheading}>Kommende Termine</div>
          <div style={styles.cardList}>
            {kommende.map((t) => (
              <TerminRow key={t.id} termin={t} onToggleAbsage={onToggleAbsage} onRemoveTermin={onRemoveTermin} />
            ))}
          </div>
        </>
      )}

      {vergangene.length > 0 && (
        <>
          <div style={styles.subheading}>Vergangene Termine</div>
          <div style={styles.cardList}>
            {vergangene.map((t) => (
              <TerminRow key={t.id} termin={t} onToggleAbsage={onToggleAbsage} onRemoveTermin={onRemoveTermin} />
            ))}
          </div>
        </>
      )}
    </div>
  );
}
